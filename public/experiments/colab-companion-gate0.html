<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WMS Colab Companion Gate 0</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #04101b; color: #eaf6ff; }
    main { width: min(1100px, 100%); margin: 0 auto; padding: 22px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: clamp(22px, 5vw, 34px); }
    p { margin: 0; color: #9fb4c8; line-height: 1.6; }
    .card { border: 1px solid rgba(89, 215, 255, .22); background: rgba(8, 24, 38, .88); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-size: 12px; color: #b9d4e7; }
    input, select, button { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid #29455b; background: #0a1b29; color: #eef9ff; padding: 0 12px; }
    button { cursor: pointer; font-weight: 800; }
    button.primary { background: #4ccff7; color: #00131d; border-color: transparent; }
    .actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .status { padding: 10px 12px; border-left: 3px solid #59d7ff; background: rgba(89, 215, 255, .07); border-radius: 10px; color: #bdefff; font-size: 12px; }
    .frame-shell { min-height: 68vh; border-radius: 18px; overflow: hidden; border: 1px solid rgba(89, 215, 255, .22); background: #02080d; }
    iframe { width: 100%; height: 72vh; border: 0; background: #fff; }
    code { color: #8fe5ff; }
    @media (max-width: 720px) {
      main { padding: 12px; }
      .actions { grid-template-columns: 1fr; }
      iframe { height: 75vh; }
    }
  </style>
</head>
<body>
<main>
  <header class="card">
    <div>
      <p>WMS EXPERIMENT</p>
      <h1>Colab Companion — Gate 0</h1>
    </div>
    <p>動画Downloadはしません。<strong>gradio.liveの埋め込み / URL受け渡し / 操作 / テストファイルDownload</strong>だけを確認します。</p>
  </header>

  <section class="card">
    <label>Gradio share URL
      <input id="companionUrl" type="url" placeholder="https://xxxxx.gradio.live" autocomplete="off" />
    </label>
    <label>Gate 0 Source URL
      <input id="sourceUrl" type="url" value="https://example.com/wms-gate0-video" />
    </label>
    <label>Title
      <input id="sourceTitle" type="text" value="WMS Gate 0 Test" maxlength="240" />
    </label>
    <label>Provider
      <select id="provider">
        <option value="youtube">YouTube</option>
        <option value="vimeo">Vimeo</option>
        <option value="other" selected>Other / Gate 0</option>
      </select>
    </label>
    <div class="actions">
      <button id="embed" class="primary" type="button">WMS内に表示</button>
      <button id="open" type="button">同じURLを別タブで開く</button>
      <button id="disconnect" type="button">Disconnect</button>
    </div>
    <div id="status" class="status">ColabでGradioを起動し、表示された <code>gradio.live</code> URLを入力してください。</div>
  </section>

  <section class="frame-shell">
    <iframe id="companionFrame" title="WMS Colab Companion Gate 0" src="about:blank" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </section>
</main>
<script>
(() => {
  const companionUrl = document.getElementById('companionUrl');
  const sourceUrl = document.getElementById('sourceUrl');
  const sourceTitle = document.getElementById('sourceTitle');
  const provider = document.getElementById('provider');
  const frame = document.getElementById('companionFrame');
  const status = document.getElementById('status');

  function preparedUrl() {
    const raw = companionUrl.value.trim();
    const url = new URL(raw);
    if (url.protocol !== 'https:' || !url.hostname.endsWith('.gradio.live')) {
      throw new Error('https://xxxxx.gradio.live のURLを入力してください。');
    }
    url.searchParams.set('wms_source', sourceUrl.value.trim());
    url.searchParams.set('wms_title', sourceTitle.value.trim());
    url.searchParams.set('wms_provider', provider.value);
    return url.toString();
  }

  document.getElementById('embed').addEventListener('click', () => {
    try {
      const url = preparedUrl();
      frame.src = url;
      status.textContent = 'iframeへ読み込みました。Source URL / Title / Provider がGradioへ自動入力されるか確認してください。';
    } catch (error) {
      status.textContent = error instanceof Error ? error.message : 'URLを確認してください。';
    }
  });

  document.getElementById('open').addEventListener('click', () => {
    try {
      const url = preparedUrl();
      window.open(url, '_blank', 'noopener,noreferrer');
      status.textContent = 'iframeと同一のPrepared URLを別タブで開きました。fallback動作の比較用です。';
    } catch (error) {
      status.textContent = error instanceof Error ? error.message : 'URLを確認してください。';
    }
  });

  document.getElementById('disconnect').addEventListener('click', () => {
    frame.src = 'about:blank';
    status.textContent = 'iframeを切断しました。';
  });
})();
</script>
</body>
</html>
