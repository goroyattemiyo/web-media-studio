name: Colab Companion Gate 0 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'colab_companion/**'
      - 'colab/WMS_Colab_Companion_Gate0.ipynb'
      - 'public/experiments/colab-companion-gate0.html'
      - '.github/workflows/colab-companion-gate0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Gradio
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'gradio==6.26.0'

      - name: Compile Gate 0 app
        run: python -m py_compile colab_companion/wms_colab_companion_gate0.py

      - name: Build Gradio Blocks without launching share tunnel
        run: |
          python - <<'PY'
          from colab_companion.wms_colab_companion_gate0 import build_demo
          demo = build_demo()
          assert demo is not None
          print('Gate 0 Blocks build: PASS')
          PY

      - name: Validate notebook JSON and pinned version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('colab/WMS_Colab_Companion_Gate0.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          code_source = '\n'.join(
              line
              for cell in notebook.get('cells', [])
              if cell.get('cell_type') == 'code'
              for line in cell.get('source', [])
          )
          assert 'gradio=={GRADIO_VERSION}' in code_source
          assert 'GRADIO_VERSION = "6.26.0"' in code_source
          assert '--share' in code_source
          assert 'yt_dlp' not in code_source.lower()
          assert 'yt-dlp' not in code_source.lower()
          print('Gate 0 notebook validation: PASS')
          PY

      - name: Verify WMS-origin iframe harness
        run: |
          grep -q 'gradio.live' public/experiments/colab-companion-gate0.html
          grep -q 'wms_source' public/experiments/colab-companion-gate0.html
          grep -q '<iframe' public/experiments/colab-companion-gate0.html
          echo 'Gate 0 iframe harness validation: PASS'
