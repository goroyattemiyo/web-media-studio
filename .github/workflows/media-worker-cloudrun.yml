name: Deploy Media Worker to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/media-worker/**"
      - ".github/workflows/media-worker-cloudrun.yml"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-23377501-df9e-4686-987
  GCP_REGION: asia-northeast1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/879005049988/locations/global/workloadIdentityPools/github/providers/web-media-studio
  GCP_SERVICE_ACCOUNT: wms-cloudrun-deployer@project-23377501-df9e-4686-987.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: wms-media-worker-runtime@project-23377501-df9e-4686-987.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required config
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ALLOWED_GOOGLE_EMAILS: ${{ vars.ALLOWED_GOOGLE_EMAILS }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          if [[ ! "${GOOGLE_CLIENT_ID}" =~ ^[0-9A-Za-z._-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::Repository variable GOOGLE_CLIENT_ID is missing or invalid."
            exit 1
          fi
          if [[ -z "${ALLOWED_GOOGLE_EMAILS// }" ]]; then
            echo "::error::Repository variable ALLOWED_GOOGLE_EMAILS is required."
            exit 1
          fi
          if [[ -z "${YOUTUBE_DATA_API_KEY// }" ]]; then
            echo "::error::Repository secret YOUTUBE_DATA_API_KEY is required for video search."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Run service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: wms-media-worker
          region: ${{ env.GCP_REGION }}
          source: services/media-worker
          env_vars_update_strategy: overwrite
          env_vars: |-
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            ALLOWED_GOOGLE_EMAILS=${{ vars.ALLOWED_GOOGLE_EMAILS }}
            ALLOWED_ORIGINS=https://goroyattemiyo.github.io
            MAX_DURATION_SECONDS=1800
            MAX_SOURCE_BYTES=786432000
            YOUTUBE_PO_TOKEN_MODE=off
            YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
            VIMEO_ACCESS_TOKEN=${{ secrets.VIMEO_ACCESS_TOKEN }}
          flags: >-
            --service-account=${{ env.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --concurrency=1
            --cpu=1
            --memory=1Gi
            --timeout=900
            --max-instances=2

      - name: Show service URL
        run: echo "${{ steps.deploy.outputs.url }}"

      - name: Verify worker health
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: curl --fail-with-body --silent --show-error "${SERVICE_URL}/health"

      - name: Verify video providers
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          curl --fail-with-body --silent --show-error
          -H "Origin: https://goroyattemiyo.github.io"
          "${SERVICE_URL}/video/providers"

      - name: Verify YouTube through video search
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          curl --fail-with-body --silent --show-error
          -H "Origin: https://goroyattemiyo.github.io"
          --get
          --data-urlencode "q=music"
          --data-urlencode "provider=youtube"
          --data-urlencode "max_results=1"
          "${SERVICE_URL}/video/search"
